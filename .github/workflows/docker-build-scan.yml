name: Docker Build & Security Scan

on:
  push:
    branches: [newbranch]
  pull_request:
    branches: [newbranch]

jobs:
  security-scan:
    name: Trivy & Gitleaks Scan
    runs-on: ubuntu-latest
    outputs:
      scan_passed: ${{ steps.check-scan.outputs.scan_passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          ignore-unfixed: true

      - name: Save Trivy scan result
        run: |
          mkdir -p scan-results
          trivy fs . > scan-results/trivy.txt

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --source=. --report-path=scan-results/gitleaks.txt --no-banner || true

      - name: Check scan results
        id: check-scan
        run: |
          has_trivy_issues=$(grep -c 'CRITICAL\|HIGH' scan-results/trivy.txt || true)
          has_gitleaks_issues=$(grep -c 'leak' scan-results/gitleaks.txt || true)

          if [ "$has_trivy_issues" -gt 0 ] || [ "$has_gitleaks_issues" -gt 0 ]; then
            echo "scan_passed=false" >> $GITHUB_OUTPUT
          else
            echo "scan_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Message - Scan Results
        run: |
          MESSAGE=$(cat <<EOF
🔍 *Security Scan Completed*

*Trivy & Gitleaks Results:*
\`\`\`
$(tail -n 20 scan-results/trivy.txt)

$(tail -n 20 scan-results/gitleaks.txt)
\`\`\`

*Passed:* ${{ steps.check-scan.outputs.scan_passed }}
EOF
)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=Markdown \
            --data-urlencode text="$MESSAGE"

  docker-build:
    name: Build Docker Image
    needs: security-scan
    if: needs.security-scan.outputs.scan_passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set Docker image name
        run: echo "IMAGE_NAME=${{ secrets.DOCKER_IMAGE_NAME || 'my-image' }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Send Telegram Message - Docker Build
        run: |
          MESSAGE=$(cat <<EOF
🐳 *Docker Build Completed Successfully*

Image: \`${{ env.IMAGE_NAME }}\`
Status: ✅ Build successful
EOF
)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=Markdown \
            --data-urlencode text="$MESSAGE"

  build-skipped:
    name: Notify if Build Skipped
    needs: security-scan
    if: needs.security-scan.outputs.scan_passed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message - Build Skipped
        run: |
          MESSAGE=$(cat <<EOF
🚫 *Build Skipped due to Security Issues*

Scan detected high/critical vulnerabilities or leaked secrets.
Fix the issues and try again.
EOF
)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=Markdown \
            --data-urlencode text="$MESSAGE"
